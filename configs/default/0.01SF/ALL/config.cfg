#Any line started with a '#' or '//' is ignored.
#If it is desired, multiple files for configurations can be used.
#Also, inside the configs folder it's possible to have multiple sub-folders, with each folder representing a different client configuration.

#server structure
#ip = postgres://postgres:@localhost:5432/test?sslmode=disable
ip = postgres://postgres:default@localhost:5532/test?sslmode=disable

#tests
scale = 0.01
#folder with the table data
folder = ../../../../potionDB docs/tpch_data/

#behaviour
doDataLoad = true
doQueries = true
doUpdates = false
nUpdateFiles = 1000
startUpdFile = 1
finishUpdateFile = 1000
updRate = 0
tpchAddRate = 0.5
latencyMode = PER_BATCH
batchMode = SINGLE

#queries
queryPrint = false
queryClients = 1
#milliseconds
queryDuration = 4000
queryWait = 25000
queries = 3 5 11 14 15 18
nReadsTxn = 1

#Stats
id = 0
statisticsInterval = 500
statsLocation = results/PostgreSQL/debug/
